# register.yaml -- the corpus source register (T33; AGT-10, PR-14)
# One entry per document under docs/ and injection/. tests/test_corpus.py and
# `python tools/corpus_add.py --verify` check that every file is listed, every
# listed file is present, every sha256 matches the file's bytes and every
# required field is set (pdm_common.corpus.verify_register).
#
# Fields:
#   doc_id    stable id the agent cites; lowercase letters, digits, '.', '_', '-'
#   title     the document's title
#   path      relative to corpus/
#   url       where the document came from. Team-written documents have no web
#             address: their url is their place in this repository,
#             repo:corpus/<path>. External documents carry the URL they were
#             downloaded from.
#   accessed  ISO date the document was retrieved; for team notes, the date written
#   licence   one of the names under `licences` below
#   sha256    SHA-256 of the file's bytes (sha256sum <file>)
#   kind      note (team-written), external (openly licensed, added with
#             tools/corpus_add.py) or injection_test (planted instructions)
#   author    who wrote it; for CC BY, the attribution
#   planted   injection_test only: what the planted instructions ask for, so the
#             agent-side tests know what must not happen
#
# The notes carry no dates of the 2020 failures, repairs, freezes or gaps, so a
# search can never hand the agent hindsight about an incident (AGT-04).
#
# A changed document needs a new sha256 here, and a new doc_id once its
# passages have been loaded into a store that results cite (see corpus/README.md).
# Keep `documents` the last key: tools/corpus_add.py appends to it.

schema_version: "0.1"

licences:            # licences a document may carry: each allows storing and quoting with attribution
  CC BY 4.0: https://creativecommons.org/licenses/by/4.0/
  CC BY-SA 4.0: https://creativecommons.org/licenses/by-sa/4.0/
  CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/

