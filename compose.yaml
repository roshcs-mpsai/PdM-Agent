# Walking skeleton — R0. Services are added here as they come up:
# replayer -> ingest/scorer -> dashboard (see the construction plan).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pdm-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mlflow:                                   # T29: the model registry (OPS-05)
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: pdm-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mlflow: {}
