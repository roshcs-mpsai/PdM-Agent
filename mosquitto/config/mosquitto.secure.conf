# Broker config for R3 hardening (NFR-06, build guide R3.1): accounts, per-service ACLs, TLS.
# mosquitto.conf stays the R0 development config (anonymous, no TLS). compose.yaml decides
# which of the two is mounted as /mosquitto/config/mosquitto.conf.
#
# What it needs mounted, none of it in git (docs/SECURITY.md):
#   /mosquitto/config/passwd   written by python tools/broker_users.py from the passwords in .env
#   /mosquitto/config/acl      mosquitto/config/acl (in git: rights only, no secrets)
#   /mosquitto/certs/          written by tools/make_certs.sh (local CA, broker certificate and key)
#   /mosquitto/data/           a volume, for persistence
#
# Written for Mosquitto 2.0 and 2.1. In 2.1 password_file and acl_file are deprecated in
# favour of plugins but still supported (removal is planned for 3.0).

# --- who may connect and what each account may do ----------------------------------------
# per_listener_settings stays off, so these three lines apply to both listeners below.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- persistence ----------------------------------------------------------------------------
# Keeps retained messages (status, prognosis, drift) and the sessions of clients that
# connect with clean session off, with their queued QoS 1 messages, across broker restarts.
persistence true
persistence_location /mosquitto/data/
# Saved every minute rather than every 30 minutes (the default), so a crash loses less.
autosave_interval 60
# A disconnected persistent session is kept this long and queues at most this many QoS 1
# messages. The default, 1000, is about 17 minutes of telemetry at 10x replay; 10000 is
# close to 3 hours.
persistent_client_expiration 7d
max_queued_messages 10000

# Empty client ids stay allowed (the default): pdm_common.mqtt.read_retained uses one and
# the broker assigns an id. Nothing in the ACL depends on client ids.

# --- listeners ------------------------------------------------------------------------------
# 8883: MQTT over TLS. Everything outside the compose network uses it: other machines, the
# plant side, and programs run on the host itself (the certificate names localhost). TLS 1.2
# is the minimum; 1.3 is negotiated when both ends have it. No client certificates: clients
# authenticate with their account, the broker with its certificate.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# 1883: plain MQTT for the services on the compose network only. Inside the container this
# listens on the loopback and on the container's compose network interface, nothing else;
# compose.yaml publishes 8883 and not 1883, so 1883 cannot be reached from the host or the
# LAN. Accounts and ACLs apply here exactly as on 8883. Traffic on 1883 never leaves the
# Docker host, which is why it is not encrypted. Do not publish 1883 with this config.
listener 1883
