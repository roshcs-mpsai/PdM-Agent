# asset_profile.yaml -- v0.1 (2026-09-20, Rosh)
# Single source of asset-specific configuration (PR-04). All downstream
# components read this file; no MetroPT-specific names in shared code.
# Values marked MEASURED come from the EDA run of 2026-09-19 on the full file.

asset:
  id: metropt3_apu
  description: "Air Production Unit compressor, Metro do Porto train (MetroPT-3, UCI dataset 791, CC BY 4.0)"
  campaign: [2020-02-01, 2020-09-01]
  records: 1516948            # MEASURED -- matches UCI exactly

sampling:
  step_seconds: 10            # MEASURED: median timestamp delta
  rate_hz: 0.1
  jitter_seconds: [9, 13]     # MEASURED: common delta range -- clock is not a clean grid
  resample_rule: 10s          # resample to a regular grid before windowing

gap_policy:
  # 331 gaps, ~909 h missing (MEASURED). Never bridge day-scale gaps.
  max_bridge_seconds: 30      # forward-fill/interpolate at most 3 samples
  drop_window_if_gap_exceeds: 30s

topics:                       # PR-01 namespace (stub -- walking skeleton fills this in)
  telemetry: pdm/metropt3_apu/telemetry
  payload_schema: telemetry_json_v1

signals:
  analog:                     # plausibility ranges from observed min/max, rounded out
    - {name: TP2,             unit: bar,  range: [-0.1, 11.0], desc: "pressure at the compressor"}
    - {name: TP3,             unit: bar,  range: [0.5, 11.0],  desc: "pressure at the pneumatic panel"}
    - {name: H1,              unit: bar,  range: [-0.1, 11.0], desc: "pressure drop at the cyclonic separator"}
    - {name: DV_pressure,     unit: bar,  range: [-0.1, 10.5], desc: "pressure drop at the towers' discharge"}
    - {name: Reservoirs,      unit: bar,  range: [0.5, 11.0],  desc: "downstream reservoir pressure"}
    - {name: Oil_temperature, unit: degC, range: [10.0, 95.0], desc: "compressor oil temperature"}
    - {name: Motor_current,   unit: A,    range: [0.0, 10.0],  desc: "one motor phase (~0 off, ~4 A offload, ~6-7 A loaded)"}
  digital:
    # active_means per Veloso et al. (2022), checked against MEASURED duty cycles.
    # polarity: verified  = description consistent with observed behaviour
    #           suspect_inverted = duty cycle contradicts description; treat 0 as
    #           the eventful state until confirmed from transitions around failures
    - {name: COMP,             active_means: "no air intake (off / offloaded)",   duty: 0.837, polarity: verified}
    - {name: DV_eletric,       active_means: "compressor under load",             duty: 0.161, polarity: verified}
    - {name: Towers,           active_means: "tower two drying",                  duty: 0.920, polarity: plausible}
    - {name: MPG,              active_means: "mirrors COMP (starts load < 8.2 bar)", duty: 0.833, polarity: verified}
    - {name: LPS,              active_means: "pressure below 7 bar",              duty: 0.003, polarity: verified}
    - {name: Pressure_switch,  active_means: "pilot-valve pressure detected",     duty: 0.991, polarity: suspect_inverted}
    - {name: Oil_level,        active_means: "oil below expected level",          duty: 0.904, polarity: suspect_inverted}
    - {name: Caudal_impulses,  active_means: "air-flow pulses present",           duty: 0.937, polarity: suspect_inverted}

features:
  # Per-asset feature pipeline -- the modality seam. The APU is slow process
  # data, so features are the resampled values themselves plus declared
  # engineered channels. A vibration asset would declare e.g. spectral_bands
  # here; the detector interface downstream is unchanged either way.
  pipeline: resample_10s

detector:
  # Reservoirs dropped as input: r = 1.00 with TP3 (MEASURED). Kept for the
  # consistency check below.
  inputs: [TP2, TP3, H1, DV_pressure, Oil_temperature, Motor_current]
  engineered:
    - name: comp_cycle_rate
      desc: "rolling COMP transitions per hour"
      justification: "cycling spikes 750-1,400/day vs ~50 baseline precede failures (EDA S4)"
  fit_on: healthy_windows      # from events.yaml, window-level, both regimes, parked stretches excluded
  score: per_signal_reconstruction_error

consistency_checks:            # deterministic checks registry (PR-10), Journey C
  - name: tp3_reservoirs_divergence
    rule: "abs(TP3 - Reservoirs) > 0.1 bar sustained over 10 min"
    meaning: "instrumentation fault on one pressure channel, not a process fault"
  - name: digital_polarity_audit
    rule: "suspect_inverted channels: verify eventful state from transitions in failure windows"
    status: open

references:
  events_file: events.yaml
  skills_folder: skills/apu_metropt3     # PR-11 stub
  checks_registry: checks/apu_metropt3   # PR-10 stub
