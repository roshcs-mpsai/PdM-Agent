# asset_profile.yaml -- v0.3 (2026-10-10, Rosh)
# Single source of asset-specific configuration (PR-04). All downstream
# components read this file; no MetroPT-specific names in shared code.
# Validated at start-up against pdm_common.schema.AssetProfile (CFG-02): a
# malformed profile stops the service with file:line errors.
# Values marked MEASURED come from the EDA run of 2026-09-19 on the full file,
# re-checked in the EDA verification of 2026-09-25/27.
# v0.2: design keys from the FRD/HLD (source_timezone, freeze_rule, windowing,
#       gate, ne107), the topic tree for the R0 services, DV_pressure out of
#       the detector inputs, load-share features in place of comp_cycle_rate
#       (a logger-freeze artifact), and the digital-channel verdicts from the
#       verification.
# v0.3: schema 0.3 -- the prognosis, incident and device topics, the feature
#       declaration file (features.yaml) as a reference, the prognosis horizons
#       and the drift windows from the FRD/HLD (sections 4.4, 4.10), and the
#       consistency checks as structured entries the registry reads.
#       Oct 10: the checks registry C1-C11 (checks/apu_metropt3), thresholds
#       from tools/calibrate_checks.py on healthy operation; the south section
#       mapping the simulated SCADA's OPC UA nodes and Sparkplug metrics.

schema_version: "0.3"

asset:
  id: metropt3_apu
  description: "Air Production Unit compressor, Metro do Porto train (MetroPT-3, UCI dataset 791, CC BY 4.0)"
  campaign: [2020-02-01, 2020-09-01]
  records: 1516948            # MEASURED -- matches UCI exactly

source_timezone: UTC          # fixed clock: no jump at the 2020-03-29 DST change (EDA 2.1, ING-09)

sampling:
  step_seconds: 10            # MEASURED: median timestamp delta
  rate_hz: 0.1
  jitter_seconds: [9, 10]     # MEASURED: real steps are 9-10 s; 99.5 % of the 11-13 s steps are logger freezes
  resample_rule: 10s          # resample to a regular grid before windowing

gap_policy:
  # 331 gaps, ~909 h missing (MEASURED). Never bridge day-scale gaps.
  max_bridge_seconds: 30      # interpolate/forward-fill at most two empty grid points
  drop_window_if_gap_exceeds: 30s
  gap_labels:                 # raw timestamp gaps (EDA 2.1); pdm_common.quality.label_gaps
    min_gap: 50s              # a step longer than 5 x the step is a gap: 331 (MEASURED)
    long_outage: 12h          # 15 gaps, 340 h; the survival model censors at these only
    overnight_stop:           # the train parked overnight: 57 gaps (MEASURED)
      min_duration: 3h
      starts_after: "19:00"   # UTC, wrapping midnight
      starts_before: "03:00"
      ends_before: "06:00"

freeze_rule:                  # logger freeze: every analog channel unchanged row to row,
  min_duration: 30min         #   every step <= max_step_s, lasting at least min_duration
  max_step_s: 15              #   (EDA 2.2: ten runs, all with a 12 s step). Masked first.

windowing:                    # ING-11; proposed, tuned on training folds only
  length: 10min
  stride: 1min

gate:                         # INC-01, INC-03; calibrated on training folds
  span: 30min
  min_fraction: 0.8
  hold_off: 6h

ne107:                        # FRD section 8 mapping, proposed
  maintenance_p72_upper: 0.5
  failure_p24_lower: 0.5
  no_data_after: 5min

topics:                       # FRD section 9 topic tree; QoS 1, canonical JSON
  telemetry: pdm/metropt3_apu/telemetry
  payload_schema: telemetry_json_v1
  windows: pdm/metropt3_apu/windows
  scores: pdm/metropt3_apu/scores
  status: pdm/metropt3_apu/status      # retained
  prognosis: pdm/metropt3_apu/prognosis   # retained
  incidents: pdm/metropt3_apu/incidents
  device: pdm/metropt3_apu/device         # G8 stretch: device_event_v1

signals:
  analog:                     # plausibility ranges from observed min/max, rounded out
    - {name: TP2,             unit: bar,  range: [-0.1, 11.0], desc: "pressure at the compressor"}
    - {name: TP3,             unit: bar,  range: [0.5, 11.0],  desc: "pressure at the pneumatic panel"}
    - {name: H1,              unit: bar,  range: [-0.1, 11.0], desc: "pressure drop at the cyclonic separator"}
    - {name: DV_pressure,     unit: bar,  range: [-0.1, 10.5], desc: "pressure drop at the towers' discharge; flat after the Jun 8 repair"}
    - {name: Reservoirs,      unit: bar,  range: [0.5, 11.0],  desc: "downstream reservoir pressure"}
    - {name: Oil_temperature, unit: degC, range: [10.0, 95.0], desc: "compressor oil temperature"}
    - {name: Motor_current,   unit: A,    range: [0.0, 10.0],  desc: "one motor phase (~0 off, ~4 A offload, ~6-7 A loaded)"}
  digital:
    # active_means per Veloso et al. (2022), checked against MEASURED duty cycles.
    # polarity: verified  = description consistent with observed behaviour
    #           plausible = consistent, not yet confirmed
    #           suspect_inverted = duty cycle contradicts description; treat 0 as
    #           the eventful state until confirmed from transitions around failures
    # informative: false = carries no usable information at this sampling rate
    - {name: COMP,             active_means: "no air intake (off / offloaded)",   duty: 0.837, polarity: verified}
    - {name: DV_eletric,       active_means: "compressor under load",             duty: 0.161, polarity: verified,
       note: "reads 1 with the motor off in 0.14 % of samples (load commanded, motor off); load share uses Motor_current instead (EDA 5.2)"}
    - {name: Towers,           active_means: "tower two drying",                  duty: 0.920, polarity: verified,
       note: "switches only under load: 0.50 loaded, 1.00 otherwise, hence the 92 % duty (EDA 4.1)"}
    - {name: MPG,              active_means: "mirrors COMP (starts load < 8.2 bar)", duty: 0.833, polarity: verified}
    - {name: LPS,              active_means: "pressure below 7 bar",              duty: 0.003, polarity: verified,
       note: "LPS = 1 coincides with Reservoirs < 7 bar (84 % / 96 %)"}
    - {name: Pressure_switch,  active_means: "pilot-valve pressure detected",     duty: 0.991, polarity: suspect_inverted,
       note: "0 is the rare event (~22 transitions/day), a load effect rather than a failure signal"}
    - {name: Oil_level,        active_means: "oil below expected level",          duty: 0.904, polarity: suspect_inverted,
       note: "no change at any of the four leaks; reads 0 for most of Aug 5-14 and Aug 18-24"}
    - {name: Caudal_impulses,  active_means: "air-flow pulses present",           duty: 0.937, polarity: suspect_inverted,
       informative: false, note: "uninformative at 0.1 Hz: median 0 transitions/day; 34 % zeros in March only"}

features:
  # Per-asset feature pipeline -- the modality seam. The APU is slow process
  # data, so features are the resampled values themselves plus declared
  # engineered channels. A vibration asset would declare e.g. spectral_bands
  # here; the detector interface downstream is unchanged either way.
  pipeline: resample_10s

detector:
  # Reservoirs dropped as input: r = 1.00 with TP3 (MEASURED). Kept for the
  # consistency check below. DV_pressure dropped: flat after the Jun 8 repair
  # (regime dv_pressure_flat in events.yaml), so a fit across that date would
  # learn the date, not the fault.
  inputs: [TP2, TP3, H1, Oil_temperature, Motor_current]
  engineered:
    # Built on Motor_current, not DV_eletric, which reads 1 with the motor off
    # (EDA 5.2). Replaces comp_cycle_rate: the COMP "cycling spikes" were all
    # logger freezes. Evaluated under leave-one-event-out before use.
    - name: load_share_6h
      kind: share_of_time       # share of observed samples meeting the condition, trailing window
      signal: Motor_current
      above: 4.5                # A: motor loaded
      window: 6h
      desc: "share of time with the motor loaded (Motor_current > 4.5 A), rolling 6 h"
    - name: rest_share_6h
      kind: share_of_time
      signal: Motor_current
      below: 1.0                # A: switched off
      window: 6h
      desc: "share of time switched off (Motor_current < 1 A), rolling 6 h"
  fit_on: healthy_windows      # negative zone of the events.yaml timeline, every regime
  score: per_signal_reconstruction_error

consistency_checks:            # deterministic checks registry (PR-10, AGT-05): checks/apu_metropt3
  # Statistical thresholds come from healthy operation only and are recomputed by
  # tools/calibrate_checks.py (--check fails when they drift); the rest are rules.
  # The evidence spans come from the gate and events.yaml gap_edges: 40 min behind
  # the gate (span + one window), a gap is 30 min without data, a restart is data
  # resuming less than 55 min (40 + the 15-min edge) before the alarm.
  - name: data_quality.motor_off_command
    id: C1
    kind: data_quality
    rule: "load commanded (DV_eletric = 1) with Motor_current < 1 A at any point of the opening window"
    meaning: "a control or data problem, not an asset fault"
  - name: data_quality.restart
    id: C2
    kind: data_quality
    rule: "data resumed after a gap of 30 min or more less than 55 min before the alarm"
    unit: min
    meaning: "a start-up transient"
  - name: data_quality.bridged_points
    id: C3
    kind: data_quality
    rule: "any interpolated grid point in the 40 min behind the gate"
    unit: points
    meaning: "values partly reconstructed"
  - name: continuous_load_signature
    id: C4
    kind: fault_signature
    rule: "hours_since_rest above its healthy 99th percentile"
    threshold: 0.1889
    unit: h
    source: tools/calibrate_checks.py
    meaning: "failure in progress"
  - name: load_share_rise
    id: C5
    kind: fault_signature
    rule: "load_share_6h above its healthy 99th percentile; inconclusive without the share"
    threshold: 0.2341
    unit: share
    source: tools/calibrate_checks.py
    meaning: "leak precursor"
  - name: oil_temperature_high
    id: C6
    kind: fault_signature
    rule: "Oil_temperature_mean of the opening window above its healthy 99th percentile"
    threshold: 70.85
    unit: degC
    source: tools/calibrate_checks.py
    meaning: "thermal stress under continuous load"
  - name: lps_activity
    id: C7
    kind: fault_signature
    rule: "LPS active minutes in the past 24 h (lps_minutes_24h) above its healthy 99th percentile"
    threshold: 28.0
    unit: min
    source: tools/calibrate_checks.py
    meaning: "low-pressure episodes"
  - name: leak_down
    id: C8
    kind: fault_signature
    rule: "TP3 lost per hour across a gap that ended in the past 6 h (the gate hold-off), above healthy gaps' 99th percentile; inconclusive with no such gap"
    threshold: 4.053
    unit: bar/h
    source: tools/calibrate_checks.py
    meaning: "an air leak while stopped"
  - name: tp3_reservoirs_divergence
    id: C9
    kind: instrument
    rule: "abs(TP3 - Reservoirs) > 0.1 bar sustained over 10 min in the 40 min behind the gate"
    threshold: 0.1
    unit: bar
    params: {sustain: 10min}
    meaning: "instrumentation fault on one pressure channel, not a process fault"
    note: "never fires on the 2020 data (p99.9 difference 0.010 bar); Journey C needs injected faults"
  - name: digital_polarity_audit
    id: C10
    kind: instrument
    rule: "suspect_inverted channels: verify eventful state from transitions in failure windows"
    status: open
    meaning: "which digital channels to trust"
  - name: refill_rate
    id: C11
    kind: fault_signature
    rule: "after a restart (C2), TP3 rise per minute while Motor_current > 4.5 A and TP3 < 9.5 bar, from data resuming to the alarm and within 24 min, below healthy restarts' 10th percentile; needs 5 min of such data"
    threshold: 0.1773
    unit: bar/min
    params: {loaded_above_a: 4.5, cut_out_bar: 9.5, min_minutes: 5}
    source: tools/calibrate_checks.py
    meaning: "a slow refill: air lost while charging"
    note: "A4's rule (Oct 3), designed after reading the LLM's answers: in-sample, evidence only"

references:
  events_file: events.yaml
  features_file: features.yaml           # every window feature, its kind and parameters
  skills_folder: skills/apu_metropt3     # PR-11
  checks_registry: checks/apu_metropt3   # PR-10

prognosis:                     # PRG-01, PRG-02 (FRD 4.4): the planner's horizons, not detection lead
  horizons: [24h, 72h, 168h]
  cadence: 1h                  # stream time
  history: 24h                 # score history the hourly row reads
  interval: 0.9                # every probability carries a 90 % interval

drift:                         # OPS-04 (FRD 4.10): Wasserstein distance per regime
  window: 24h                  # the last 24 simulated hours ...
  every: 6h                    # ... against the healthy reference, every 6 simulated hours
  signals: [TP2, TP3, H1, Oil_temperature, Motor_current]

south:                         # ING-14: southbound sources -> profile signals (services/south)
  opcua:
    endpoint: "opc.tcp://localhost:4841/scada-sim/"   # the simulated SCADA (4840 is opcua_north)
    publishing_interval: 10s                          # one record per interval of source time
    tags:                                             # OPC UA node id -> signal
      "ns=2;s=APU.TP2": TP2
      "ns=2;s=APU.TP3": TP3
      "ns=2;s=APU.H1": H1
      "ns=2;s=APU.DV_pressure": DV_pressure
      "ns=2;s=APU.Reservoirs": Reservoirs
      "ns=2;s=APU.Oil_temperature": Oil_temperature
      "ns=2;s=APU.Motor_current": Motor_current
      "ns=2;s=APU.COMP": COMP
      "ns=2;s=APU.DV_eletric": DV_eletric
      "ns=2;s=APU.Towers": Towers
      "ns=2;s=APU.MPG": MPG
      "ns=2;s=APU.LPS": LPS
      "ns=2;s=APU.Pressure_switch": Pressure_switch
      "ns=2;s=APU.Oil_level": Oil_level
      "ns=2;s=APU.Caudal_impulses": Caudal_impulses
  sparkplug:
    group: pdm_testbed
    edge_node: scada_sim
    device: apu
    metrics:                                          # Sparkplug metric name -> signal
      APU/TP2: TP2
      APU/TP3: TP3
      APU/H1: H1
      APU/DV_pressure: DV_pressure
      APU/Reservoirs: Reservoirs
      APU/Oil_temperature: Oil_temperature
      APU/Motor_current: Motor_current
      APU/COMP: COMP
      APU/DV_eletric: DV_eletric
      APU/Towers: Towers
      APU/MPG: MPG
      APU/LPS: LPS
      APU/Pressure_switch: Pressure_switch
      APU/Oil_level: Oil_level
      APU/Caudal_impulses: Caudal_impulses
