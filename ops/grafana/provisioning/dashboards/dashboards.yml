# Dashboards from files (R3.5; T24). Mount ops/grafana/dashboards at
# /var/lib/grafana/dashboards. Edits made in the UI are not kept: change the JSON
# in the repository (export from the UI, then replace the file).
apiVersion: 1

providers:
  - name: pdm-agent
    orgId: 1
    folder: PdM-Agent
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
