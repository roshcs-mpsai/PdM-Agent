  # --- logger freezes: the data repeat a snapshot; the gate did not alarm ------------------------
  - id: S11
    kind: freeze
    as_of: 2020-06-23T12:00:00Z
    open: as_gate
    note: "The Jun 22-25 loaded snapshot."
    expect: {evidence_state: [insufficient, sufficient], lead: [data_quality, none]}
  - id: S12
    kind: freeze
    as_of: 2020-05-27T12:00:00Z
    open: as_gate
    note: "The May 26-28 freezes."
    expect: {evidence_state: [insufficient, sufficient], lead: [data_quality, none]}

  # --- injected sensor faults (profiles/metropt3_apu/faults/sensor_faults.yaml) -------------------
  - id: S13
    kind: sensor_fault
    faults: profiles/metropt3_apu/faults/sensor_faults.yaml
    replay: {from: 2020-06-25T12:00:00, to: 2020-07-04T16:00:00}
    fault_start: 2020-07-02T08:00:00Z
    note: "Panel pressure reads 2 bar low: the detector alarms and the divergence check (C9) fails."
    expect: {evidence_state: [sufficient], lead: [instrumentation], action: [sensor_check]}
  - id: S14
    kind: sensor_fault
    faults: profiles/metropt3_apu/faults/sensor_faults.yaml
    replay: {from: 2020-06-25T12:00:00, to: 2020-07-04T16:00:00}
    fault_start: 2020-07-04T08:00:00Z
    note: "Oil reads 25 degC high with nothing else wrong: a look-alike of thermal stress."
    expect: {evidence_state: [insufficient, sufficient], lead: [instrumentation, process, none],
             action: [sensor_check, data_quality_check, monitor]}

  # --- healthy controls: no alarm; the agent asked anyway --------------------------------------
  - id: S15
    kind: healthy_control
    as_of: 2020-04-22T12:00:00Z
    open: as_gate
    expect: {evidence_state: [insufficient], lead: [none], action: [monitor, data_quality_check]}
  - id: S16
