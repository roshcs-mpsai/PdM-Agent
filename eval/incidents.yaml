    expect: {evidence_state: [sufficient, insufficient], lead: [process, none]}

  # --- load held: the compressor kept loaded, panel pressure raised ----------------------------
  - id: S08
    kind: load_held
    as_of: 2020-03-11T18:54:00Z
    expect: {evidence_state: [sufficient, insufficient], lead: [process, data_quality, none]}
  - id: S09
    kind: load_held
    as_of: 2020-03-27T07:43:00Z
    expect: {evidence_state: [sufficient, insufficient], lead: [process, data_quality, none]}
  - id: S10
    kind: load_held
    as_of: 2020-04-12T12:17:00Z
