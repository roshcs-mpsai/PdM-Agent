# The scripted-incident library (T28; EVL-08, PR-12, PR-13): 20 incidents, each with the tool
# sequence and evidence state the team expects. eval/run_incidents.py runs the agent on them
# (the pinned model, or the rules policy for a dry run) and eval/audit.py scores the runs.
#
# as_of: the opening the incident is diagnosed as of (UTC). For kinds the gate opens, it is the
# frozen gate's opening on the replayed campaign (eval/out/freeze, the 34 incidents); the runner
# uses the incident the replay opened at that time. "open: as_gate" opens one at as_of the way
# the gate does (its parameters, the checks as of the opening), for times the gate did not alarm.
# Injected faults (faults:) replay their own span with the faults file and use the first incident
# the gate opens after the fault starts.
#
# expect.tools: the core steps of skills/shared/incident_triage, in order (a run is correct when
#   they appear in this order; search_knowledge and device_health may come between or after).
# expect.evidence_state: the states the team accepts. expect.lead: the accepted categories of the
#   most likely hypothesis (none: the brief has no likely hypothesis).
# These expectations come from the EDA and the events file, not from any run; change them at a sync.

schema: incidents_v1
asset: metropt3_apu
core_tools: [run_check, attribute_anomaly, get_telemetry, get_maintenance_history]
optional_tools: [search_knowledge, device_health]

incidents:
  # --- the four reported air leaks (events.yaml F1-F4): the gate's opening nearest the report ---
  - id: S01
    kind: reported_leak
    event: F1
    as_of: 2020-04-18T00:48:00Z
    note: "The 15 h before are a logger freeze; data resume at 00:18, 30 min before the alarm."
    expect: {evidence_state: [insufficient, sufficient], lead: [data_quality, process, none]}
  - id: S02
    kind: reported_leak
    event: F2
    as_of: 2020-05-29T23:46:00Z
    note: "Opened 16 min after the report starts; the EDA shows no lead-up."
    expect: {evidence_state: [sufficient, insufficient], lead: [process, none]}
  - id: S03
    kind: reported_leak
    event: F3
    as_of: 2020-06-05T10:19:00Z
    expect: {evidence_state: [sufficient, insufficient], lead: [process, none]}
  - id: S04
    kind: reported_leak
    event: F4
    as_of: 2020-07-15T00:46:00Z
    note: "No rest from Jul 15 00:00; the lead-up the EDA can see."
    expect: {evidence_state: [sufficient], lead: [process]}

  # --- probable leaks: expert-reported failures that forced no repair ----------------------------
  - id: S05
    kind: probable_leak
    as_of: 2020-03-28T23:30:00Z
    note: "March, outside the expert log's coverage; one of the uncertain continuous-load runs."
    expect: {evidence_state: [sufficient, insufficient], lead: [process, none]}
  - id: S06
    kind: probable_leak
    as_of: 2020-05-13T14:13:00Z
