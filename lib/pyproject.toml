[project]
name = "pdm_common"
version = "0.1.0"
description = "Shared PdM-Agent code: profile and events loading, hashing, time helpers"
requires-python = ">=3.10"
dependencies = ["pyyaml", "pydantic>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdm_common*"]
